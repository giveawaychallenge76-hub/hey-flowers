<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for saj — the field ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Special+Elite&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<!--
════════════════════════════════════════════════
  the field — one real photo (tree, cloud, grass all in it),
  regions made clickable:
  guitar → music · cloud → slow star rain · tree → butterflies.
  Cards float with no white frame — content only.
  CUSTOMIZE: CONFIG block at the top of the script.
════════════════════════════════════════════════
-->
<style>
:root{ --ink:#26211a; --red:{{accent}}; --gold:#e8b62e; --hf-font:{{font_family}}; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Special Elite','Courier New',monospace;background:#5a9be0;overflow:hidden;color:var(--ink)}

/* ═══ the photo scene ═══ */
#scene{position:fixed;inset:0;overflow:hidden}
#sceneImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
#scene.shakeC #sceneImg{animation:shC .55s ease}
#scene.shakeT #sceneImg{animation:shT .55s ease}
@keyframes shC{0%,100%{transform:none}22%{transform:translate(-7px,3px) rotate(-.35deg)}48%{transform:translate(6px,-2px) rotate(.3deg)}74%{transform:translate(-3px,2px)}}
@keyframes shT{0%,100%{transform:none}25%{transform:translateX(-6px) rotate(.3deg) scale(1.004)}55%{transform:translateX(6px) rotate(-.28deg)}80%{transform:translateX(-3px)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(125% 100% at 50% 38%, rgba(0,0,0,0) 66%, rgba(10,30,60,.2) 100%)}
#grain{position:fixed;inset:-40px;z-index:60;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='170' height='170'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='170' height='170' filter='url(%23n)'/></svg>")}

/* clickable regions mapped onto the photo */
.hot{position:fixed;z-index:6;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hot.done{cursor:default}

/* little "click me" tags */
.clickTag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:9;pointer-events:none;
  font-family:'Caveat',cursive;font-weight:700;font-size:22px;color:#fff;white-space:nowrap;
  text-shadow:0 2px 10px rgba(20,60,120,.7), 0 0 2px rgba(20,60,120,.5);
  animation:tagbob 1.6s ease-in-out infinite;transition:opacity .6s}
@keyframes tagbob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.clickTag.off{opacity:0}

/* guitars — real stickers on the grass */
#guitar{position:fixed;left:10%;bottom:4.5%;width:min(150px,17vw);z-index:7;cursor:pointer;
  transform:rotate(14deg);transform-origin:50% 90%;filter:drop-shadow(0 14px 18px rgba(10,50,20,.4));transition:transform .25s}
#guitar:hover{transform:rotate(11deg) scale(1.05)}
#guitar img{width:100%;display:block}
#guitar.strum{animation:strum .5s ease}
@keyframes strum{0%,100%{transform:rotate(14deg)}25%{transform:rotate(9deg) scale(1.04)}60%{transform:rotate(17deg)}}
#starGuitar{position:fixed;right:8%;bottom:4%;width:min(110px,13vw);z-index:6;transform:rotate(-12deg);
  filter:drop-shadow(0 12px 16px rgba(10,50,20,.35));opacity:0;transition:opacity 1.2s, transform 1.2s;pointer-events:none}
#starGuitar.on{opacity:1;transform:rotate(-9deg)}
#starGuitar img{width:100%}

/* extra stickers scattered on the grass */
.gstick{position:fixed;z-index:5;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(10,50,20,.35))}
.gstick img{width:100%;display:block}

/* header — bubble font */
#head{position:fixed;left:24px;top:16px;z-index:10;pointer-events:none}
#head .h1{font-family:var(--hf-font),'Baloo 2',cursive;font-weight:800;font-size:clamp(34px,5.6vw,58px);line-height:1;
  color:#ffdd55;text-shadow:0 4px 0 #4f68c4, 0 8px 18px rgba(20,50,140,.35);letter-spacing:.01em}
#head .h2{font-family:var(--hf-font),'Baloo 2',cursive;font-weight:600;font-size:clamp(13px,2vw,17px);letter-spacing:.14em;
  color:#fff;text-shadow:0 2px 0 #4f68c4, 0 4px 10px rgba(20,50,140,.3);margin-top:4px}

.note{position:fixed;z-index:8;font-size:20px;color:#fff;text-shadow:0 2px 8px rgba(20,60,120,.5);pointer-events:none}

#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-90px);z-index:30;
  background:rgba(255,253,244,.97);border-radius:999px;padding:8px 22px 10px;font-size:14px;
  box-shadow:0 12px 30px rgba(20,50,100,.35);transition:transform .45s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast b{color:var(--red)}

/* falling stars */
.fstar{position:fixed;z-index:9;pointer-events:none}
.fstar img{width:100%;display:block}

/* butterflies */
.bfly{position:fixed;z-index:12;cursor:pointer;-webkit-tap-highlight-color:transparent;
  filter:drop-shadow(0 6px 8px rgba(20,50,100,.3))}
.bfly .wings{display:inline-block;animation:flap .4s ease-in-out infinite alternate;transform-origin:50% 50%}
.bfly .wings img{width:58px;display:block}
.bfly .wings .emj{font-size:36px;line-height:1;display:block}
@keyframes flap{0%{transform:scaleX(1) rotate(-4deg)}100%{transform:scaleX(.6) rotate(5deg)}}
.bfly.rest .wings{animation-duration:1s}
.bfly .dot{position:absolute;right:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 0 12px rgba(201,58,69,.8);animation:dotpulse 1.2s infinite}
@keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.bfly.seen .dot{display:none}
.bfly.gold{filter:sepia(1) saturate(3) hue-rotate(-14deg) drop-shadow(0 0 14px rgba(255,210,80,.95)) drop-shadow(0 6px 8px rgba(20,50,100,.3))}
.bfly.gold .wings img{width:74px}
.bfly.gold .wings .emj{font-size:48px}

/* ═══ frameless cards — content only, no white box ═══ */
#ovl{position:fixed;inset:0;z-index:40;background:rgba(15,30,60,.55);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:16px}
#ovl.on{display:flex}
#ovlClose{position:fixed;right:18px;top:16px;z-index:45;width:40px;height:40px;border-radius:50%;
  background:rgba(255,253,244,.95);color:#7a6a45;font-size:19px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,20,50,.4)}
#ovlClose:hover{color:var(--red);transform:scale(1.08)}
#card{width:min(430px,94vw);max-height:88vh;overflow:auto;position:relative;
  animation:cardin .45s cubic-bezier(.2,1.35,.4,1);scrollbar-width:none}
#card::-webkit-scrollbar{display:none}
@keyframes cardin{0%{transform:scale(.7) translateY(40px);opacity:0}100%{transform:none;opacity:1}}

.cimg{width:100%;display:flex;justify-content:center;margin:6px 0}
.cimg img{max-width:86%;max-height:52vh;object-fit:contain;filter:drop-shadow(0 16px 30px rgba(0,15,40,.45))}
.ccap{font-size:15px;text-align:center;line-height:1.65;color:#fff;margin-top:12px;
  text-shadow:0 2px 12px rgba(10,25,60,.8)}
.ccap b{color:#ffd76a}
.clist{font-size:14.5px;line-height:2.1;background:#fbf8ee;border:1.5px dashed #c2b394;border-radius:12px;
  padding:14px 18px;margin:8px 0;color:var(--ink);box-shadow:0 16px 34px rgba(0,15,40,.4)}
.clist b{color:var(--red)}

/* license */
.licwrap{position:relative;width:100%;container-type:inline-size;filter:drop-shadow(0 18px 36px rgba(0,15,40,.5))}
.licwrap > img{width:100%;display:block}
.lf{position:absolute;font-family:'Caveat',cursive;font-weight:700;color:#1d2a6e;transform:rotate(-.8deg);white-space:nowrap;font-size:clamp(13px,4.3cqw,22px)}
.lf.f1{left:60%;top:20.5%}
.lf.f2{left:62%;top:27%}
.lf.f3{left:64%;top:33.2%}
.lf.f4{left:64%;top:39.3%}
.lf.sig{left:55%;top:79%;font-size:clamp(15px,5cqw,26px)}
.lf.photo{left:8%;top:32%;width:38%;text-align:center;white-space:normal;font-size:clamp(15px,5.4cqw,26px);color:#8e2f4e;transform:rotate(-2deg);line-height:1.15}

/* chat — its own box, no card behind */
.chatbox{background:rgba(255,255,255,.97);border-radius:14px;padding:12px 10px;min-height:240px;
  box-shadow:0 16px 34px rgba(0,15,40,.4)}
.chatbox .chead{font-size:11px;color:#8a7a55;border-bottom:1px solid #eee7d2;padding-bottom:5px;margin-bottom:8px;display:flex;justify-content:space-between}
.b2{max-width:84%;margin:6px 0;padding:6px 11px 8px;border-radius:14px;border-bottom-left-radius:4px;
  background:#efece2;font-size:14.5px;line-height:1.3;width:fit-content;animation:b2in .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes b2in{0%{transform:scale(.7) translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.b2.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#b3a98d;margin:0 1.5px;animation:d2 1s ease-in-out infinite}
.b2.dots i:nth-child(2){animation-delay:.15s}.b2.dots i:nth-child(3){animation-delay:.3s}
@keyframes d2{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-3px);opacity:1}}
.b2 img{display:block;width:min(230px,58vw)}
.b2.imgb{background:transparent;padding:2px 0}

/* receipt — paper only */
.rwrap2{overflow:hidden;display:flex;justify-content:center}
.receipt2{width:min(280px,78vw);background:#fffdf6;font-family:'Special Elite',monospace;font-size:14px;line-height:1.7;
  color:#33291a;padding:16px 18px 18px;box-shadow:0 18px 40px rgba(0,15,40,.45);
  transform:translateY(-102%);transition:transform 1.6s cubic-bezier(.3,.8,.4,1);
  -webkit-mask:linear-gradient(#000 0 0) padding-box, radial-gradient(5px at 5px 100%, transparent 97%, #000) -5px 100%/10px 10px repeat-x padding-box}
.receipt2.out{transform:translateY(0)}
.receipt2 h4{text-align:center;font-size:14px;letter-spacing:.1em;font-weight:400}
.receipt2 .rl{border-top:1.5px dashed #c2b394;margin:8px 0}
.receipt2 .rr{display:flex;justify-content:space-between;gap:8px}
.receipt2 .rr span:last-child{white-space:nowrap}
.receipt2 .tot{font-weight:700}
.receipt2 .bc{height:26px;margin-top:10px;background:repeating-linear-gradient(90deg,#33291a 0 2px,transparent 2px 5px,#33291a 5px 6px,transparent 6px 9px)}
.receipt2 .tiny{text-align:center;font-size:11px;color:#8a7a55;margin-top:5px}

/* memory files — its own dark box */
.files{background:rgba(28,32,44,.97);border-radius:12px;padding:12px 14px;font-family:'Special Elite',monospace;
  box-shadow:0 16px 34px rgba(0,15,40,.45)}
.files .path{color:#8fa4ff;font-size:12px;border-bottom:1px solid #3a4050;padding-bottom:6px;margin-bottom:8px}
.files .f{color:#e8ecf8;font-size:14px;line-height:1.5;margin:7px 0;display:flex;gap:9px;opacity:0;transform:translateX(-8px);transition:.4s}
.files .f.in{opacity:1;transform:none}
.files .f i{font-style:normal;flex:none}

/* final */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.twin figure{margin:0}
.twin img{width:100%;border-radius:10px;box-shadow:0 14px 30px rgba(0,15,40,.5);aspect-ratio:.9;object-fit:cover}
.twin figcaption{font-family:'Caveat',cursive;font-weight:600;font-size:18px;text-align:center;margin-top:6px;line-height:1.1;
  color:#fff;text-shadow:0 2px 10px rgba(10,25,60,.8)}
.qrow2{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
.qbig2{font-family:var(--hf-font),'Baloo 2',cursive;font-weight:800;font-size:30px;width:100%;text-align:center;line-height:1.05;
  color:#ffdd55;text-shadow:0 3px 0 #4f68c4, 0 6px 14px rgba(20,50,140,.4)}
.yb{font-family:var(--hf-font),'Baloo 2',cursive;font-weight:800;font-size:19px;color:#fff;border:0;border-radius:999px;padding:11px 40px 12px;cursor:pointer;
  background:linear-gradient(180deg,#ff6f7e,var(--red) 60%,#9c1f2b);box-shadow:0 6px 0 #7c141f, 0 0 26px rgba(201,58,69,.5);transition:transform .15s;letter-spacing:.03em}
.yb:hover{transform:scale(1.06) rotate(-1deg)}
.sb{font-family:var(--hf-font),'Baloo 2',cursive;font-weight:600;font-size:14px;color:#fff;background:rgba(255,253,244,.22);
  border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(3px)}
.qnote3{font-size:13px;color:#fff;text-align:center;margin-top:10px;min-height:1.2em;text-shadow:0 2px 10px rgba(10,25,60,.8)}
.stamp4{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0;
  font-family:var(--hf-font),'Baloo 2',cursive;font-weight:800;font-size:44px;color:#ff5b69;border:5px solid #ff5b69;
  border-radius:14px;padding:6px 20px;letter-spacing:.04em;transition:.4s cubic-bezier(.2,1.4,.4,1);pointer-events:none;
  text-shadow:0 2px 0 #7c141f;background:rgba(255,255,255,.12);backdrop-filter:blur(1px)}
.stamp4.on{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
/* After YES the card becomes a little certificate. The stamp was absolutely
   positioned and kept landing ON the "it's official — X + Y" line, which made
   both unreadable. Once approved it joins the normal flow instead, so it can
   never overlap no matter how long the two names are. */
#card.approved{padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
#card.approved .stamp4{position:static;transform:rotate(-9deg);opacity:1;
  font-size:clamp(22px,7vw,34px);border-width:4px;padding:5px 16px;margin:18px 0 4px;
  align-self:center;flex:none}
#card.approved .qrow2{margin-top:0}
#card.approved .qbig2{font-size:clamp(19px,5.4vw,26px);line-height:1.15}
#card.approved .qnote3{font-size:12.5px;line-height:1.5;padding:0 6px}

@media (max-width:640px){
  #guitar{left:4%;bottom:6.5%;width:116px}
  #starGuitar{right:3%}
  .bfly .wings img{width:48px}
  #head .h1{font-size:32px}
}
</style>
</head>
<body>
<div id="hf-stage" style="position:fixed;inset:0;pointer-events:none;z-index:60"></div>

<div id="scene">
  <img id="sceneImg" src="crush-assets/meadow.jpg" alt="">
</div>
<div id="vig"></div>
<div id="grain"></div>

<!-- clickable photo regions (positioned by JS onto the image) -->
<div class="hot" id="hotCloud"><span class="clickTag" id="tagCloud">click me ☁</span></div>
<div class="hot" id="hotTree"><span class="clickTag" id="tagTree">click me 🌳</span></div>

<div id="guitar">
  <span class="clickTag" id="tagGuitar">click me 🎸</span>
  <img src="crush-assets/guitar-acoustic.png" alt="">
</div>
<div id="starGuitar"><img src="crush-assets/guitar-star.png" alt=""></div>

<!-- stickers on the grass -->
<span class="gstick" style="left:24%;bottom:5%;width:56px;transform:rotate(-8deg)"><img src="stickers/smiley.png" alt=""></span>
<span class="gstick" style="left:33%;bottom:11%;width:46px;transform:rotate(10deg)"><img src="stickers/star-red.png" alt=""></span>
<span class="gstick" style="left:45%;bottom:4%;width:58px;transform:rotate(4deg)"><img src="stickers/polaroid.png" alt=""></span>
<span class="gstick" style="left:56%;bottom:12%;width:64px;transform:rotate(-5deg)"><img src="stickers/camera.png" alt=""></span>
<span class="gstick" style="left:66%;bottom:5%;width:70px;transform:rotate(6deg)"><img src="stickers/cassette.png" alt=""></span>
<span class="gstick" style="left:76%;bottom:13%;width:58px;transform:rotate(-7deg)"><img src="stickers/envelope.png" alt=""></span>

<div id="head">
  <div class="h1">for saj,</div>
  <div class="h2">a little field i made for you · — naveen</div>
</div>

<div id="toast"></div>
<div id="ovl"><span id="ovlClose">✕</span><div id="card"></div></div>

<script>
(function(){
"use strict";

/* ══════════ CONFIG ══════════ */
var HER = "{{her}}";
var HIM = "{{him}}";

var CHAT_MSGS = [
  "{{chat_open}}",
  "{{chat_1}}",
  "{{chat_2}}",
  "{{chat_3}}",
  "{{chat_4}}",
  "{{chat_end}}"
];

var RECEIPT_LINES = [
  ["{{r1l}}", "{{r1v}}"],
  ["{{r2l}}", "{{r2v}}"],
  ["{{r3l}}", "{{r3v}}"],
  ["{{r4l}}", "{{r4v}}"],
  ["{{r5l}}", "{{r5v}}"],
  ["{{r6l}}", "{{r6v}}"]
];

var MEMORIES = [
  ["📁", "{{mem1}}"],
  ["📁", "{{mem2}}"],
  ["📁", "{{mem3}}"],
  ["📁", "{{mem4}}"],
  ["📁", "{{mem5}}"],
  ["🔒", "{{mem6}}"]
];

var LIC = {
  f1: HER,
  f2: "{{lic_born}}",
  f3: "{{lic_place}}",
  f4: "",
  f5: HIM + " ツ",
  f6: "♥\n(your face here)"
};
/* ════════════════════════════ */

document.querySelector("#head .h1").textContent = "for " + HER + ",";
document.querySelector("#head .h2").textContent = "a little field i made for you · — " + HIM;

/* ── map hotspots onto the cover-fit photo ── */
var IMG_W = 1800, IMG_H = 1285, FOCUS_X = 0.6;
var ZONES = {
  hotCloud: { x:.385, y:.26, w:.28, h:.20 },   /* the big middle cloud */
  hotTree:  { x:.615, y:.40, w:.27, h:.29 }    /* the tree on the hill */
};
function layoutZones(){
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.max(vw / IMG_W, vh / IMG_H);
  var dw = IMG_W * s, dh = IMG_H * s;
  var ox = (vw - dw) * FOCUS_X, oy = (vh - dh) * 0.5;
  Object.keys(ZONES).forEach(function(id){
    var z = ZONES[id], el = document.getElementById(id);
    el.style.left = (ox + z.x * dw) + "px";
    el.style.top = (oy + z.y * dh) + "px";
    el.style.width = (z.w * dw) + "px";
    el.style.height = (z.h * dh) + "px";
  });
}
layoutZones();
window.addEventListener("resize", layoutZones);

/* ── audio: warm, audible, romantic ── */
var AC = null, MASTER = null, playing = false;
function ac(){
  if(!AC){
    var C = window.AudioContext||window.webkitAudioContext;
    if(C){
      AC = new C();
      var comp = AC.createDynamicsCompressor();
      MASTER = AC.createGain(); MASTER.gain.value = 1.0;
      MASTER.connect(comp); comp.connect(AC.destination);
    }
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function pluck(f, when, vol){
  var a = ac(); if(!a) return;
  var t = a.currentTime + when;
  var o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
  o.type = "triangle"; o.frequency.value = f;
  o2.type = "sine"; o2.frequency.value = f * 2;
  lp.type = "lowpass"; lp.frequency.setValueAtTime(2800, t); lp.frequency.exponentialRampToValueAtTime(700, t + 1.3);
  g.gain.setValueAtTime(vol || .3, t);
  g.gain.exponentialRampToValueAtTime(.0006, t + 1.5);
  o.connect(g); o2.connect(g); g.connect(lp); lp.connect(MASTER);
  o.start(t); o.stop(t + 1.55); o2.start(t); o2.stop(t + 1.55);
}
function pad(freqs, when, dur){
  var a = ac(); if(!a) return;
  var t = a.currentTime + when;
  freqs.forEach(function(f){
    var o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = f;
    o.detune.value = (Math.random()*10-5);
    lp.type = "lowpass"; lp.frequency.value = 900;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.05, t + dur*.35);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(lp); lp.connect(MASTER);
    o.start(t); o.stop(t + dur + .05);
  });
}
var CHORDS = [
  { arp:[130.81,196.00,261.63,329.63,392.00], pad:[261.63,329.63,392.00], mel:[523.25,659.25] },
  { arp:[164.81,246.94,329.63,392.00,493.88], pad:[329.63,392.00,493.88], mel:[659.25,587.33] },
  { arp:[110.00,164.81,220.00,261.63,329.63], pad:[261.63,329.63,440.00], mel:[523.25,440.00] },
  { arp:[ 87.31,174.61,261.63,349.23,440.00], pad:[261.63,349.23,440.00], mel:[440.00,523.25] }
];
var BAR = 3.4, chordIdx = 0;
function bar(){
  var ch = CHORDS[chordIdx % CHORDS.length]; chordIdx++;
  pad(ch.pad, 0, BAR + .4);
  [0,2,3,4,3,2,1,2].forEach(function(pi, i){
    pluck(ch.arp[Math.min(pi, ch.arp.length-1)], i * (BAR/8), pi === 0 ? .34 : .22);
  });
  pluck(ch.mel[0], BAR*.25, .16);
  pluck(ch.mel[1], BAR*.66, .13);
}
function startMusic(){
  if (playing) return;
  playing = true;
  bar(); setInterval(bar, BAR * 1000);
  setInterval(function(){
    var g = document.getElementById("guitar").getBoundingClientRect();
    var n = document.createElement("span");
    n.className = "note"; n.textContent = Math.random() < .5 ? "♪" : "♫";
    n.style.left = (g.left + g.width * (0.3 + Math.random() * .4)) + "px";
    n.style.top = (g.top + 10) + "px";
    document.body.appendChild(n);
    n.animate([
      { transform:"translate(0,0) rotate(0)", opacity:1 },
      { transform:"translate(" + (Math.random()*60-30) + "px,-130px) rotate(" + (Math.random()*50-25) + "deg)", opacity:0 }
    ], { duration:2400, easing:"ease-out", fill:"forwards" });
    setTimeout(function(){ n.remove(); }, 2500);
  }, 700);
}

/* ── toast ── */
var toastT = null;
function toast(html){
  var t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

/* ── stars: whole sky, slow, few ── */
var HUES = [0, 40, 90, 150, 200, 260, 310];
function dropStars(n){
  if (document.querySelectorAll(".fstar").length > 18) return;
  for (var i = 0; i < n; i++){
    var s = document.createElement("span");
    s.className = "fstar";
    var sz = 12 + Math.random() * 18;
    s.style.width = sz + "px";
    s.innerHTML = '<img src="stickers/star-red.png" alt="" style="filter:hue-rotate(' + HUES[(Math.random()*HUES.length)|0] + 'deg) saturate(1.5) drop-shadow(0 3px 3px rgba(20,50,100,.3))">';
    s.style.left = (Math.random() * 96 + 2) + "vw";
    s.style.top = "-46px";
    document.body.appendChild(s);
    var drift = Math.random() * 70 - 35;
    var dur = 8000 + Math.random() * 5000;
    s.animate([
      { transform:"translate(0,0) rotate(0)", opacity:0 },
      { transform:"translate(" + drift * .3 + "px," + (window.innerHeight * .3) + "px) rotate(" + (Math.random()*140-70) + "deg)", opacity:1 },
      { transform:"translate(" + drift + "px," + (window.innerHeight * 1.08) + "px) rotate(" + (Math.random()*280-140) + "deg)", opacity:.9 }
    ], { duration: dur, easing:"linear", fill:"forwards" });
    setTimeout(function(el){ el.remove(); }.bind(null, s), dur + 200);
  }
}

/* ── interactions ── */
var guitar = document.getElementById("guitar");
var hotCloud = document.getElementById("hotCloud");
var hotTree = document.getElementById("hotTree");
var scene = document.getElementById("scene");
var rainOn = false;

guitar.addEventListener("click", function(){
  guitar.classList.remove("strum"); void guitar.offsetWidth; guitar.classList.add("strum");
  if (!playing){
    startMusic();
    document.getElementById("tagGuitar").classList.add("off");
    document.getElementById("starGuitar").classList.add("on");
    toast("music on ♪ <b>she plays too?</b> even better.");
  } else { bar(); }
});

hotCloud.addEventListener("click", function(){
  scene.classList.remove("shakeC"); void scene.offsetWidth; scene.classList.add("shakeC");
  if (!rainOn){
    rainOn = true;
    document.getElementById("tagCloud").classList.add("off");
    dropStars(4);
    setInterval(function(){ dropStars(1); }, 1900);
    toast("the sky says <b>okay ♥</b> — stars till the end.");
  } else {
    dropStars(3);
  }
});

/* tree → butterflies; once empty, no more shaking */
var released = 0, TOTAL = 6, emptyToldOnce = false;
hotTree.addEventListener("click", function(){
  if (released >= TOTAL){
    if (!emptyToldOnce){
      emptyToldOnce = true;
      toast("the tree is empty — <b>the butterflies have it all</b> ♥");
    }
    return;
  }
  scene.classList.remove("shakeT"); void scene.offsetWidth; scene.classList.add("shakeT");
  releaseButterfly(released);
  released++;
  if (released === 1) document.getElementById("tagTree").classList.add("off");
  if (released === TOTAL){
    hotTree.classList.add("done");
    toast("that's all of them — <b>the golden one</b> has the question ✨");
  }
});

/* butterflies: real image if present, emoji until then */
var bflyOk = false;
(function(){
  var probe = new Image();
  probe.onload = function(){ bflyOk = true; };
  probe.src = "crush-assets/butterfly.png";
})();
var BF_HUES = [0, -25, 30, 60, -50];

function releaseButterfly(i){
  var isFinal = (i === TOTAL - 1);
  var b = document.createElement("span");
  b.className = "bfly" + (isFinal ? " gold" : "");
  var inner = bflyOk
    ? '<img src="crush-assets/butterfly.png" alt=""' + (!isFinal ? ' style="filter:hue-rotate(' + BF_HUES[i % BF_HUES.length] + 'deg)"' : '') + '>'
    : '<span class="emj">🦋</span>';
  b.innerHTML = '<span class="wings">' + inner + '</span><span class="dot"></span>';
  var tr = hotTree.getBoundingClientRect();
  var sx = tr.left + tr.width * .5, sy = tr.top + tr.height * .3;
  b.style.left = sx + "px"; b.style.top = sy + "px";
  document.body.appendChild(b);
  flutterSfx();
  var rx = window.innerWidth * (0.1 + Math.random() * 0.8);
  var ry = window.innerHeight * (0.12 + Math.random() * 0.4);
  if (isFinal){ rx = window.innerWidth * .5; ry = window.innerHeight * .26; }
  var dx = rx - sx, dy = ry - sy;
  b.animate([
    { transform:"translate(0,0) scale(.4)" },
    { transform:"translate(" + dx*.4 + "px," + (dy*.3 - 90) + "px) scale(1.1)" },
    { transform:"translate(" + dx + "px," + dy + "px) scale(1)" }
  ], { duration: 2400, easing:"cubic-bezier(.3,.6,.4,1)", fill:"forwards" });
  setTimeout(function(){
    b.style.left = rx + "px"; b.style.top = ry + "px";
    b.animate([{ transform:"translate(0,0)" }], { duration:1 }).finish();
    b.classList.add("rest");
    b.animate([
      { transform:"translate(0,0)" },
      { transform:"translate(6px,-9px)" },
      { transform:"translate(-5px,4px)" },
      { transform:"translate(0,0)" }
    ], { duration:4200, iterations:Infinity, easing:"ease-in-out" });
  }, 2450);
  b.addEventListener("click", function(){
    b.classList.add("seen");
    openExhibit(i, isFinal);
  });
}
function flutterSfx(){
  var a = ac(); if(!a) return;
  [1400,1750,1580].forEach(function(f,i){
    var t = a.currentTime + i*.07;
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.035, t); g.gain.exponentialRampToValueAtTime(.0005, t+.12);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.14);
  });
}

/* ── frameless exhibits ── */
var ovl = document.getElementById("ovl");
var card = document.getElementById("card");
var cardTimers = [];
function later(fn, ms){ cardTimers.push(setTimeout(fn, ms)); }
function closeCard(){ ovl.classList.remove("on"); cardTimers.forEach(clearTimeout); cardTimers = []; }
ovl.addEventListener("click", function(e){ if (e.target === ovl) closeCard(); });
document.getElementById("ovlClose").addEventListener("click", closeCard);

function shell(html){
  cardTimers.forEach(clearTimeout); cardTimers = [];
  card.innerHTML = html;
  ovl.classList.add("on");
}

function openExhibit(i, isFinal){
  if (isFinal) return openFinal();
  if (i === 0) openLicense();
  if (i === 1) openChat();
  if (i === 2) openReceipt();
  if (i === 3) openMemory();
  if (i === 4) openPriorities();
}

/* 1 — the crush license: license only, nothing else */
function openLicense(){
  shell(
    '<div class="licwrap">' +
      '<img src="crush-assets/license-blank.png" alt="">' +
      '<div class="lf f1" id="lf1"></div><div class="lf f2" id="lf2"></div>' +
      '<div class="lf f3" id="lf3"></div><div class="lf f4" id="lf4"></div>' +
      '<div class="lf sig" id="lf5"></div><div class="lf photo" id="lf6"></div>' +
    '</div>' +
    '<div class="ccap">permanent. non-transferable. <b>no expiry date — i checked.</b></div>');
  var today = new Date().toLocaleDateString(undefined,{day:"2-digit",month:"2-digit",year:"numeric"});
  var fields = [["lf1",LIC.f1],["lf2",LIC.f2],["lf3",LIC.f3],["lf4",LIC.f4||today],["lf5",LIC.f5],["lf6",LIC.f6]];
  var t = 400;
  fields.forEach(function(f){
    later(function(){
      var el = card.querySelector("#" + f[0]);
      if (!el) return;
      var i2 = 0;
      (function tp(){
        i2++;
        el.textContent = f[1].slice(0, i2);
        if (i2 < f[1].length) later(tp, 50);
      })();
    }, t);
    t += Math.max(f[1].length * 50 + 300, 650);
  });
}

/* 2 — reminders: just the chat box */
function openChat(){
  shell(
    '<div class="chatbox"><div class="chead"><span>to: ' + HER + ' ♥</span><span>drafts — sent now</span></div><div id="chatB"></div></div>' +
    '<div class="ccap">to be loved is to be <b>reminded</b>.</div>');
  var body = card.querySelector("#chatB");
  var t = 350;
  CHAT_MSGS.forEach(function(msg){
    later(function(){
      var d = document.createElement("div");
      d.className = "b2 dots"; d.innerHTML = "<i></i><i></i><i></i>";
      body.appendChild(d);
    }, t);
    t += 540 + Math.min(msg.length * 11, 620);
    later(function(){
      var dd = body.querySelector(".dots"); if (dd) dd.remove();
      var bb = document.createElement("div");
      bb.className = "b2"; bb.textContent = msg;
      body.appendChild(bb);
    }, t);
    t += 230;
  });
}

/* 3 — proof of effort: the receipt only */
function openReceipt(){
  var rows = RECEIPT_LINES.map(function(r){
    return '<div class="rr"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
  }).join("");
  shell(
    '<div class="rwrap2"><div class="receipt2" id="rc2">' +
      '<h4>EFFORT RECEIPT ★ OFFICIAL</h4>' +
      '<div style="text-align:center;font-size:12px">customer: my heart · re: ' + HER + '</div>' +
      '<div class="rl"></div>' + rows + '<div class="rl"></div>' +
      '<div class="rr tot"><span>TOTAL</span><span>everything i\'ve got</span></div>' +
      '<div class="bc"></div>' +
      '<div class="tiny">no refunds on feelings ♥</div>' +
    '</div></div>');
  later(function(){
    var r = card.querySelector("#rc2");
    if (r) r.classList.add("out");
  }, 150);
}

/* 4 — memory card: the dark file box only */
function openMemory(){
  var items = MEMORIES.map(function(m){
    return '<div class="f"><i>' + m[0] + '</i><span>' + m[1] + '</span></div>';
  }).join("");
  shell(
    '<div class="files"><div class="path">DCIM &gt; ' + HER + ' &gt; things_i_noticed</div>' + items + '</div>' +
    '<div class="ccap">i\'ve been paying attention <b>for a while</b>.</div>');
  card.querySelectorAll(".files .f").forEach(function(f, i){
    later(function(){ f.classList.add("in"); }, 300 + i * 320);
  });
}

/* 5 — priorities: the note only */
function openPriorities(){
  shell(
    '<div class="clist" style="text-align:center">1. <b>you</b><br>2. <b>you</b><br>3. <b>you</b><br>4. <b>you</b><br>5. see 1–4.</div>' +
    '<div class="ccap" style="font-size:28px;line-height:1.2">🐸📜♥</div>');
}

/* golden — the question */
var saidYes = false;
function openFinal(){
  shell(
    '<div class="qrow2"><div class="qbig2">{{bemine_q}}</div>' +
      '<button class="yb" id="yesBtn">YES ♥</button>' +
      '<button class="sb" id="shyBtn">gimme a sec 🙈</button></div>' +
    '<div class="qnote3" id="qnote3"></div>' +
    '<div class="stamp4" id="stamp4">APPROVED ♥</div>');
  card.querySelector("#yesBtn").addEventListener("click", onYes);
  card.querySelector("#shyBtn").addEventListener("click", function(){
    card.querySelector("#qnote3").textContent = "take your time… the button waits with you ♥";
    this.textContent = "ok… YES ♥"; this.className = "yb";
    this.addEventListener("click", onYes);
  });
}

function onYes(){
  if (saidYes) return;
  saidYes = true;
  card.classList.add("approved");            // opens up room so the stamp frames the names
  var st = card.querySelector("#stamp4");
  if (st) st.classList.add("on");
  [523,659,784,1046,1318].forEach(function(f,i){ pluck(f, i*.13, .16); });
  for (var w = 0; w < 6; w++) setTimeout(function(){ dropStars(8); }, w * 600);
  var now = new Date();
  var stamp = now.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) +
              " · " + now.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  setTimeout(function(){
    var q = card.querySelector(".qrow2");
    if (q) q.innerHTML = '<div class="qbig2">it\'s official — ' + HER + ' + ' + HIM + ' ♥</div>';
    var n = card.querySelector("#qnote3");
    if (n) n.innerHTML = "approved on <b style='color:#ffd76a'>" + stamp + "</b><br>screenshot this &amp; send it to " + HIM + " — he's been refreshing his phone all day ♥";
    toast('she said <b>YES</b> ♥ — ' + stamp);
  }, 900);
}

/* ── editor: clicking a page tab opens that section straight away ── */
window.addEventListener("message", function(e){
  var d = e.data || {}; if(!d.__gotoPage) return;
  var s = d.__gotoPage;
  if(s==='profile')        openLicense();
  else if(s==='reminders') openChat();
  else if(s==='receipt')   openReceipt();
  else if(s==='memories')  openMemory();
  else if(s==='bemine')    openFinal();
});
})();
</script>
